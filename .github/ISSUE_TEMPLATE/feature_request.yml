name: 기능 제안
description: 이런 기능이 있으면 좋겠어요
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        제안은 [ROADMAP.md](../blob/main/ROADMAP.md)의 원칙과 [판단 기준](../blob/main/docs/TRIAGE.md)으로 검토하고, 적용해 본 결과를 이 이슈에 남깁니다.
        "하지 않는 것"(서버·추적·번호 수집 등)에 해당하면 이유를 설명드리고 대안을 함께 찾습니다.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 겪고 있나요?
      description: 기능 이름보다 **상황**을 먼저 적어 주세요(누가, 언제, 무엇이 불편한지).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 어떻게 되면 좋겠나요?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금은 어떻게 해결하고 있나요? / 다른 방법
  - type: dropdown
    id: roadmap
    attributes:
      label: 로드맵과의 관계 (모르면 "모르겠어요")
      options: [로드맵에 있는 항목이에요, 로드맵에 없지만 원칙에는 맞는 것 같아요, 원칙과 안 맞을 수도 있어요, 모르겠어요]
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: 도와줄 수 있나요?
      options:
        - label: PR 로 직접 만들어 볼 수 있어요
        - label: 내 폰에서 시험해 볼 수 있어요
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 실제 이름·전화번호를 적지 않았어요.
          required: true
